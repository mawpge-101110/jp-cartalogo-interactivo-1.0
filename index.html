<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Trofeos & Diseños</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- NAVBAR TOP -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-accent">JP</span> Catálogo 3D
        </div>
        <div class="nav-actions">
         <a href="https://wa.me/5493888650351?text=Hola!%20Vengo%20desde%20la%20p%C3%A1gina%20web%20y%20quiero%20hacer%20una%20consulta."
               target="_blank" 
               class="btn-whatsapp-top">
               <i class="fa-brands fa-whatsapp"></i> Añadir WhatsApp
            </a>
        </div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Catálogo de Productos & Trofeos</h1>
        <p>Haz clic en cualquier imagen para verla ampliada o consultar directamente por WhatsApp.</p>
    </section>

    <!-- GALERÍA DE IMÁGENES -->
    <main class="container">
        <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- MODAL PARA ZOOM DE FOTO -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="imgFull">
        <div id="caption"></div>
        <a id="modalWaBtn" href="#" target="_blank" class="btn-whatsapp-modal">
            <i class="fa-brands fa-whatsapp"></i> Consultar por este modelo
        </a>
    </div>

    <script src="script.js"></script>
</body>
</html>
